# Temporary helper — delete after the baselines are regenerated.
#
# The Guardian visual baselines can only be produced by the same Chromium build
# CI runs (npm run test:update needs `playwright install --with-deps chromium`).
# Restricted sandboxes fall back to @sparticuz/chromium, which renders with
# different font metrics, so baselines generated there never match CI.
#
# Trigger: gh workflow run update-visual-baselines.yml --ref <branch>
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm run build

      - name: Install Guardian dependencies
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm ci

      - name: Install Chromium
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:update

      - name: Commit and push baselines
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add test/lena-runtime-visual-guardian-v1/screenshots
          if git diff --staged --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore(guardian): regenerate visual baselines on CI Chromium"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

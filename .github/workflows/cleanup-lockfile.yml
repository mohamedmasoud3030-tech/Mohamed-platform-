name: Cleanup lockfile artifact

on:
  push:
    branches:
      - chore/deep-cleanup-20260903

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/deep-cleanup-20260903

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile from cleaned workspace
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

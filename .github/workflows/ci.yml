name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, build, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify
        # Typecheck and build cannot detect a metadata regression, a locale
        # routing mistake, personal data leaking into an event or a support
        # report, an authorization hole, or a World Command authority drift.
        run: pnpm run verify

      - name: LENA Guardian static integrity
        run: node test/lena-runtime-visual-guardian-v1/scripts/verify-assets.mjs

  guardian-browser:
    name: LENA Guardian browser + visual
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested PR merge
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm run build

      - name: Install Guardian dependencies
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm ci

      - name: Install Chromium
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npx playwright install --with-deps chromium

      - name: Static asset contract
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run verify:assets

      - name: Runtime smoke
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:smoke

      - name: Runtime safety
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:safety

      - name: Visual regression
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:visual

      - name: Upload Guardian diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lena-guardian-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test/lena-runtime-visual-guardian-v1/test-results
            test/lena-runtime-visual-guardian-v1/playwright-report
